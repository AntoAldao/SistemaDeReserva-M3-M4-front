name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "hotfix/**"]

jobs:
  quality-check:
    name: Calidad (formato, lint, tests, build)
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato (Prettier)
        run: npm run format:check

      - name: Verificar buenas prácticas (ESLint)
        run: npm run lint

      - name: Ejecutar tests unitarios (Jest)
        run: npm test

      - name: Generar build
        run: npm run build

      - name: Publicar build como artefacto
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Merge a develop: despliegue automático al ambiente de desarrollo (canal "dev" de Firebase Hosting).
  deploy-dev:
    name: Deploy a desarrollo (Firebase Hosting)
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deploy.outputs.details_url }}
    concurrency: deploy-development

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Desplegar en Firebase Hosting (canal dev)
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: dev
          expires: 30d

  # Merge a main: despliegue a producción. El environment "production" exige
  # la aprobación manual de los revisores configurados en GitHub.
  deploy-prod:
    name: Deploy a producción (Firebase Hosting)
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.details_url }}
    concurrency: deploy-production

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Desplegar en Firebase Hosting (live)
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
